[project]
name = "bibliopa"
version = "1.0.0"
description = "A 90-year-old's private bibliography, moved from Word documents into PostgreSQL and a web app"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.19.0",
    "anthropic==0.120.2",
    "psycopg[binary]==3.3.4",
    "psycopg2-binary==2.9.12",
    "python-docx==1.2.0",
    "python-dotenv==1.2.2",
    "RapidFuzz==3.14.5",
    "rich==15.0.0",
    "SQLAlchemy==2.0.51",
]

[project.optional-dependencies]
dev = [
    "jupyter==1.1.1",
    "jupyterlab==4.6.2",
    "ipywidgets==8.1.8",
    "pandas==3.0.5",
    "numpy==2.5.1",
    "openpyxl==3.1.5",
]
